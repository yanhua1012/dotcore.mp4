schema: spec-driven

context: |
  技術棧以 .NET 10 與 C# 為主。
  Library 類型的專案若無 .NET 10 專屬功能需求，應優先採用 .NET Standard 2.0，以提高相容性與泛用性。
  C# 程式應優先採用 async/await 非同步模式，避免使用阻塞性操作。
  所有公開型別與公開成員應撰寫正體中文 XML documentation summary 註解。
  所有產出除了關鍵技術名詞、領域名詞、識別名稱與程式碼以外，其餘內容皆應使用正體中文。
  變更若涉及既有 artifacts，應遵循最小變更原則，避免改動與目前需求無關的內容。

rules:
  proposal:
    - 使用正體中文撰寫，關鍵技術名詞、領域名詞、識別名稱與程式碼可保留英文。
    - 若變更涉及既有 artifacts，應明確說明最小變更範圍。
    - 避免提出與目前需求無直接關係的重構或架構調整。
    - 若 Library 專案可使用 .NET Standard 2.0，應優先評估其可行性與相容性。

  specs:
    - 使用正體中文撰寫，關鍵技術名詞、領域名詞、識別名稱與程式碼可保留英文。
    - 測試情境應清楚描述前置條件、操作行為與預期結果。
    - 需求若涉及既有行為，應以最小變更原則描述新增或修改範圍。
    - 非同步操作應明確描述取消、逾時、例外與資源釋放行為。

  design:
    - 使用正體中文撰寫，關鍵技術名詞、領域名詞、識別名稱與程式碼可保留英文。
    - C# 設計應優先採用 async/await，避免同步等待非同步工作或其他阻塞性操作。
    - Library 專案若無 .NET 10 專屬功能需求，應優先以 .NET Standard 2.0 為目標框架。
    - 公開型別與公開成員應規劃正體中文 XML documentation summary 註解。
    - 涉及既有架構或 artifacts 時，應採用最小變更方案。
    - 不得為了此次需求進行無關的重新命名、格式調整或大範圍重構。

  tasks:
    - 使用正體中文撰寫，關鍵技術名詞、領域名詞、識別名稱與程式碼可保留英文。
    - 任務必須依測試先行的順序編排。
    - 先定義測試情境與案例，再建立或修改自動化測試。
    - 測試建立後，應先確認測試因功能尚未實作而呈現紅燈。
    - 確認紅燈後才可開始實作功能。
    - 功能實作完成後，應執行測試並確認轉為綠燈。
    - 最後執行相關回歸測試，確認既有功能未受影響。
    - 功能實作應優先採用 async/await，避免阻塞性操作。
    - 公開型別與公開成員應加入正體中文 XML documentation summary 註解。
    - 修改既有 artifacts 或程式碼時，只處理完成需求所需的最小範圍。
    - 每個拆解的任務最多兩小時，若超過兩小時，應再拆解為更小的任務。
